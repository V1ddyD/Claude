# Netlify configuration.
#
# The Next.js runtime is detected automatically; what needs declaring is the
# scheduler. On Vercel that is `vercel.json`'s cron block, and both files are
# kept so the same repository deploys either way.

[build]
  command = "npm run build"
  # No `publish`: setting one makes Netlify serve the build as static files,
  # and for an app of entirely dynamic routes that means every page 404s.

# The Next.js runtime, a dependency and declared here.
#
# Netlify installs it on its own for sites built from a connected Git
# repository. This one is deployed by API upload, where it does not — the build
# succeeds, `plugin_state` reads "none", and every route 404s because nothing
# turned the Next.js output into functions. Declaring it without installing it
# fails the build instead, because Netlify cannot resolve it from npm; both
# halves are needed.
#
# A dependency rather than a devDependency, together with @netlify/functions:
# a build environment that omits dev dependencies would lose the plugin AND
# fail `next build`'s type check of the scheduled function that imports them.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # The migrations and the seed are run once, by hand, against the hosted
  # database (see README). A build that migrates is a build that can take the
  # site down; this one only compiles.
  NODE_VERSION = "22"

# `@netlify/database` is a dependency for one reason: its presence is what makes
# Netlify provision a Postgres for this site. The application does not import
# it — it talks to the database through postgres.js and DATABASE_URL, so the
# same code runs on any Postgres anywhere.

# Drains the job queue: queued email, follow-up evaluation, hold expiry,
# retention and rate-limit sweeping. Authenticated by CRON_SECRET, so the
# endpoint is not a public way to run arbitrary queued work.
[functions."worker"]
  schedule = "*/5 * * * *"
